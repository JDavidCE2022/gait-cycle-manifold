[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gait-cycle-manifold"
version = "0.1.0"
description = "Autoencoder recurrente (GRU) del manifold de ciclos de marcha, con cierre del ciclo y codificador fundacional congelado"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.10",
    "pyarrow>=14.0",
    "torch>=2.2",
]

[project.optional-dependencies]
foundation = [
    "timesfm>=3.0",
    "huggingface_hub>=0.24",
    "safetensors>=0.4",
]
notebooks = [
    "jupyter>=1.0",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
cycle-manifold = "cycle_manifold.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
